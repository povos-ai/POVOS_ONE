version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: povos_postgres
    environment:
      POSTGRES_user: povos_user
      POSTGRES_PASSWORD: povos_password
      POSTGRES_DB: povos_one
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U povos_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: povos_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: povos_backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://povos_user:povos_password@postgres:5432/povos_one?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: POVOS_ONE_SUPER_SECRET_2026_PRODUCTION
      JWT_EXPIRES_IN: 1d
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
  redis_data: