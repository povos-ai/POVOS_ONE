@"
services:
  - type: web
    name: povos-one-backend
    runtime: node
    repo: https://github.com/povos-ai/POVOS_ONE
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: DATABASE_URL
        fromDatabase:
          name: povos-one-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://povos-one-backend.onrender.com

  - type: postgresql
    name: povos-one-db
    plan: free
    databaseName: povos_one
    user: povos_user
"@ | Out-File -FilePath "D:\POVOS_ONE\render.yaml" -Encoding utf8